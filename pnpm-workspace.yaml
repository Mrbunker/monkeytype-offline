packages:
  - frontend
  - packages/*

allowBuilds:
  "@fortawesome/fontawesome-free": true
  "@parcel/watcher": true
  core-js: true
  esbuild: true
  msgpackr-extract: true
  protobufjs: true
  re2: true

overrides:
  "postcss": "8.5.8"
engineStrict: true
saveExact: true
savePrefix: ""

# Keep local and CI dependency layouts consistent.
enableGlobalVirtualStore: false
