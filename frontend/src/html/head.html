<head>
  <link
    rel="preload"
    href="/webfonts/RobotoMono-Regular.woff2"
    type="font/woff2"
    as="font"
    crossorigin
  />
  <link
    rel="preload"
    href="/webfonts/LexendDeca-Regular.woff2"
    type="font/woff2"
    as="font"
    crossorigin
  />

  <script>
    document.addEventListener("keydown", function (e) {
      if (e.key == "Escape") e.preventDefault();
    });
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monkeytype Offline | Local typing practice</title>
  <!-- fallback theme colors -->
  <style>
    :root {
      --bg-color: #323437;
      --main-color: #e2b714;
      --caret-color: #e2b714;
      --sub-color: #646669;
      --sub-alt-color: #2c2e31;
      --text-color: #d1d0c5;
      --error-color: #ca4754;
      --error-extra-color: #7e2a33;
      --colorful-error-color: #ca4754;
      --colorful-error-extra-color: #7e2a33;
      --nav-focus-opacity: 0;
    }
  </style>
  <link
    rel="icon"
    type="image/x-icon"
    sizes="32x32"
    href="/images/favicon/favicon.ico"
  />
  <link
    rel="apple-touch-icon"
    sizes="180x180"
    href="/images/favicon/apple-touch-icon.png"
  />
  <link
    rel="mask-icon"
    href="/images/favicon/safari-pinned-tab.svg"
    color="#eee"
  />
  <meta name="msapplication-TileColor" content="#e2b714" />
  <meta
    name="msapplication-config"
    content="%BASE_URL%images/favicon/browserconfig.xml"
  />
  <meta name="name" content="Monkeytype Offline | Local typing practice" />
  <meta
    name="description"
    content="Local typing practice based on Monkeytype. No account or backend required."
  />
  <meta name="darkreader-lock" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <style>
    /* 
      Layer order NEEDS to be here and one layer per line.
      This is because vite changes the order of the css imports,
      and the layer definition needs to be at the very very top, otherwise things break.
    */
    @layer normalize;
    @layer theme;
    @layer base;
    @layer components;
    @layer properties;
    @layer vendor;
    @layer custom-styles;
    @layer hidden;
    @layer utilities;
  </style>
  <link rel="stylesheet" class="testtesttest" href="styles/index.scss" />
  <link rel="stylesheet" class="testtest" href="styles/tailwind.css" />
  <link rel="stylesheet" class="test" href="styles/vendor.scss" />

  <style class="customFont" type="text/css"></style>
</head>
